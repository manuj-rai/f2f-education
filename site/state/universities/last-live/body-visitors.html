<script>
(function () {
  'use strict';
  var root = document.querySelector('.f2f-page--universities') || document;
  var ICONS = JSON.parse(document.getElementById('u-icons').textContent);
  var FILES = 'https://lwfiles.mycourse.app/6afaa7bf8bf68da1fa81b933-public/';
  var TOP = 5; // courses listed per institution; "View all" opens the rest on /courses

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function filesBase() { var l = document.querySelector('link[rel~="icon"]'); var m = l && /^(https:\/\/[^\/]+\/[^\/]+-public\/)/.exec(l.href); return m ? m[1] : FILES; }
  function imageUrl(img) { return !img ? '' : (/^https?:\/\//.test(img) ? img : filesBase() + String(img).replace(/^\//, '')); }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function initials(name) { return name.split(/\s+/).filter(function (w) { return /^[A-Za-z0-9]/.test(w) && !/^(of|the|and|for|in)$/i.test(w); }).slice(0, 3).map(function (w) { return w.charAt(0).toUpperCase(); }).join(''); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  function load() {
    var meta = document.querySelector('meta[name="csrf-token"]');
    return fetch('/api/learner/products', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json', accept: 'application/json', 'csrf-token': meta ? meta.content : '' },
      body: JSON.stringify({
        type: 'course', access: 'public,private-enroll,soon,view-locked', excludeNotEnrolledPrivateProductsForAdmin: 'true',
        hideProductsWithoutVisibleOptions: 'true', fields: 'title,titleId,access,cohorts.authors,settings',
        sortFields: [{ sortField: 'learnerAccessPriority', direction: 'asc' }, { sortField: 'order', direction: 'desc' }],
        offset: '0', itemsPerPage: '200', paginationType: 'offset'
      })
    }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { if (!j || !Array.isArray(j.data)) throw new Error('Unexpected response'); return j.data; });
  }

  // Courses in SITE.featured (site/custom-code/body.html) come first, in that order; the rest keep LearnWorlds' order (A–Z)
  function featuredFirst(list) {
    var f = (window.F2FSite && window.F2FSite.featured) || [];
    function rank(c) { var i = f.indexOf(c.titleId); return i < 0 ? f.length : i; }
    return list.map(function (c, i) { return [c, i]; }).sort(function (a, b) { return rank(a[0]) - rank(b[0]) || a[1] - b[1]; }).map(function (x) { return x[0]; });
  }

  function render(courses) {
    // Group courses by institution (course author), in catalogue order
    var byName = {}, list = [];
    courses.forEach(function (c) {
      var seen = {};
      (c.cohorts || []).forEach(function (h) {
        (h.authors || []).forEach(function (a) {
          if (!a || !a.name || seen[a.name]) return;
          seen[a.name] = 1;
          if (!byName[a.name]) { byName[a.name] = { name: a.name, image: a.image, courses: [] }; list.push(byName[a.name]); }
          if (!byName[a.name].image && a.image) byName[a.name].image = a.image;
          byName[a.name].courses.push(c);
        });
      });
    });

    root.querySelector('[data-u-count]').textContent = list.length
      ? plural(list.length, 'institution', 'institutions') + ' · ' + plural(courses.length, 'course', 'courses')
      : '';
    var grid = root.querySelector('[data-u-grid]');
    if (!list.length) { grid.innerHTML = '<p class="u-empty">Institutions will appear here as their courses are published.</p>'; return; }

    grid.innerHTML = list.map(function (u) {
      var img = imageUrl(u.image);
      return '<article class="u-card" id="uni-' + slug(u.name) + '" aria-labelledby="uni-' + slug(u.name) + '-name">' +
        // Left: logo, name below it, "View all". Right: the institution's first TOP courses as picture cards, so an
        // institution with one course is a short row, not a tall empty card. No prices (as on home; the course page has them).
        '<header class="u-card-head">' +
          '<div class="u-logo">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy" decoding="async">' : '<span>' + esc(initials(u.name)) + '</span>') + '</div>' +
          '<h2 class="u-name" id="uni-' + slug(u.name) + '-name">' + esc(u.name) + '</h2>' +
          '<a class="u-all" href="/courses?institution=' + encodeURIComponent(u.name) + '">View all ' +
            (u.courses.length === 1 ? 'courses' : u.courses.length + ' courses') +
            '<span class="u-visually-hidden"> from ' + esc(u.name) + '</span> <img src="' + ICONS.arrow + '" width="16" height="16" alt=""></a>' +
        '</header>' +
        '<ul class="u-courses">' + u.courses.slice(0, TOP).map(function (c) {
          var s = c.settings || {}, pic = imageUrl(s.image);
          var parts = String(s.points || '').split('·').map(function (t) { return t.trim(); }).filter(Boolean);
          return '<li><a class="u-course" href="/course/' + encodeURIComponent(c.titleId) + '">' +
            '<span class="u-course-media">' + (pic ? '<img src="' + esc(pic) + '" alt="" loading="lazy" decoding="async">' : '') + '</span>' +
            '<span class="u-course-body"><span class="u-course-title">' + esc(c.title) + '</span>' +
            '<span class="u-course-meta">' + (c.access === 'soon' ? '<span class="u-soon">Coming soon</span>'
              : parts[0] ? '<img src="' + ICONS.clock + '" width="14" height="14" alt="">' + esc(parts.join(' · ')) : '') + '</span></span></a></li>';
        }).join('') + '</ul>' +
      '</article>';
    }).join('');

    // Arriving from a partner logo (…/universities#uni-name): bring that card into view once it exists
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) { t.classList.add('is-target'); t.scrollIntoView({ block: 'center' }); } }
  }

  load().then(function (c) { render(featuredFirst(c)); }, function () {
    root.querySelector('[data-u-grid]').innerHTML = '<p class="u-empty">Institutions couldn’t load just now. <a href="/courses">Browse all courses</a></p>';
  });
})();
</script>
</div>
<script>
/* Moves this page between the header and footer, and LearnWorlds sections into their slots. */
(function () {
  var page = document.getElementById('f2f-page');
  var main = document.querySelector('#sectionsWrapper main') || document.querySelector('main');
  if (!page || !main) return;
  main.parentNode.insertBefore(page, main);
  function fillSlots() {
    var slots = page.querySelectorAll('[data-lw-section], [data-lw-element]');
    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i], whole = slot.hasAttribute('data-lw-section');
      var hit = document.querySelector(slot.getAttribute(whole ? 'data-lw-section' : 'data-lw-element'));
      var node = hit && (whole ? (hit.closest('.learnworlds-section') || hit) : hit);
      if (node && !page.contains(node)) slot.parentNode.replaceChild(node, slot);
      else slot.setAttribute('data-lw-missing', '');
    }
  }
  if (document.readyState === 'complete') fillSlots(); else window.addEventListener('load', fillSlots);
  page.addEventListener('click', function (e) {
    var a = e.target.closest('[data-f2f-open]');
    if (!a) return;
    e.preventDefault();
    var form = a.getAttribute('data-f2f-open');
    var lw = document.querySelector('.js-linked-node[data-interactive-link-type="openformslink"][data-interactive-link-var1="' + form + '"]');
    if (lw && !page.contains(lw)) lw.click(); else location.href = '/?msg=not-logged-in';
  });
})();
</script>
